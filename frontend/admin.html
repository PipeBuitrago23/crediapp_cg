<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CrediApp - Panel Administrativo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">
  <div class="max-w-4xl mx-auto p-4 sm:p-6">
    <h1 class="text-2xl font-bold text-center text-indigo-700 mb-6">Panel Administrativo</h1>

    <div id="mensaje-error" class="hidden mb-4 rounded-lg bg-red-100 text-red-700 px-4 py-3 text-sm"></div>

    <!-- Login -->
    <section id="vista-login" class="bg-white rounded-2xl shadow p-5 sm:p-8 max-w-sm mx-auto space-y-4">
      <h2 class="text-lg font-semibold">Ingreso de administrador</h2>
      <div>
        <label class="block text-sm font-medium mb-1">Email</label>
        <input id="login-email" type="email" class="w-full rounded-lg border-slate-300 border px-3 py-2" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Contraseña</label>
        <input id="login-password" type="password" class="w-full rounded-lg border-slate-300 border px-3 py-2" />
      </div>
      <button id="btn-login" type="button" class="w-full px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-semibold">Ingresar</button>
    </section>

    <!-- Panel -->
    <div id="vista-panel" class="hidden space-y-6">
      <div class="flex justify-end">
        <button id="btn-logout" type="button" class="px-4 py-2 rounded-lg bg-slate-200 hover:bg-slate-300 text-sm font-medium">Cerrar sesión</button>
      </div>

      <!-- Dashboard -->
      <section class="bg-white rounded-2xl shadow p-5 sm:p-8">
        <h2 class="text-lg font-semibold mb-4">Dashboard</h2>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 text-sm">
          <div class="rounded-lg bg-indigo-50 border border-indigo-100 p-4">
            <p class="text-slate-500">Monto total colocado</p>
            <p id="kpi-total-colocado" class="text-xl font-bold text-indigo-700">$0</p>
          </div>
          <div class="rounded-lg bg-amber-50 border border-amber-100 p-4">
            <p class="text-slate-500">Pendiente por cobrar</p>
            <p id="kpi-pendiente-cobrar" class="text-xl font-bold text-amber-700">$0</p>
          </div>
          <div class="rounded-lg bg-green-50 border border-green-100 p-4">
            <p class="text-slate-500">Intereses recaudados</p>
            <p id="kpi-intereses" class="text-xl font-bold text-green-700">$0</p>
          </div>
        </div>
      </section>

      <!-- Buscador -->
      <section class="bg-white rounded-2xl shadow p-5 sm:p-8 space-y-4">
        <h2 class="text-lg font-semibold">Buscar créditos</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="flex gap-2">
            <input id="buscar-documento" type="text" placeholder="Documento del cliente" class="flex-1 rounded-lg border-slate-300 border px-3 py-2" />
            <button id="btn-buscar-documento" type="button" class="px-4 py-2 rounded-lg bg-slate-200 hover:bg-slate-300 text-sm font-medium">Buscar</button>
          </div>
          <div class="flex gap-2">
            <input id="buscar-imei" type="text" placeholder="IMEI del equipo" class="flex-1 rounded-lg border-slate-300 border px-3 py-2" />
            <button id="btn-buscar-imei" type="button" class="px-4 py-2 rounded-lg bg-slate-200 hover:bg-slate-300 text-sm font-medium">Buscar</button>
          </div>
        </div>
        <div id="resultados-creditos" class="space-y-4"></div>
      </section>

      <!-- Vendedores -->
      <section class="bg-white rounded-2xl shadow p-5 sm:p-8 space-y-4">
        <h2 class="text-lg font-semibold">Vendedores</h2>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <input id="vendedor-nombre" type="text" placeholder="Nombre" class="rounded-lg border-slate-300 border px-3 py-2" />
          <input id="vendedor-email" type="email" placeholder="Email" class="rounded-lg border-slate-300 border px-3 py-2" />
          <input id="vendedor-password" type="password" placeholder="Contraseña inicial" class="rounded-lg border-slate-300 border px-3 py-2" />
        </div>
        <button id="btn-crear-vendedor" type="button" class="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm">Crear vendedor</button>
        <div id="lista-vendedores" class="space-y-2"></div>
      </section>

      <!-- Banners -->
      <section class="bg-white rounded-2xl shadow p-5 sm:p-8 space-y-4">
        <h2 class="text-lg font-semibold">Banners publicitarios</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <input id="banner-titulo" type="text" placeholder="Título de campaña" class="rounded-lg border-slate-300 border px-3 py-2" />
          <input id="banner-url" type="text" placeholder="URL de la imagen" class="rounded-lg border-slate-300 border px-3 py-2" />
          <input id="banner-inicio" type="date" class="rounded-lg border-slate-300 border px-3 py-2" />
          <input id="banner-fin" type="date" class="rounded-lg border-slate-300 border px-3 py-2" />
        </div>
        <button id="btn-crear-banner" type="button" class="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm">Crear banner</button>
        <div id="lista-banners" class="space-y-2"></div>
      </section>
    </div>
  </div>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
