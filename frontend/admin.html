<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CG Store - Panel Administrativo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#0056BF",
            "primary-dark": "#00459A",
            accent: "#00C853",
            "accent-dark": "#00A344",
            background: "#F8FAFC",
            ink: "#1E293B",
          },
          fontFamily: {
            sans: ["Montserrat", "sans-serif"],
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-background min-h-screen text-ink font-sans">
  <header class="bg-white shadow-sm">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 py-4">
      <img src="img/logo.png" alt="CG Store" class="h-10 w-auto" />
      <p class="text-sm text-slate-500 mt-1">Panel Administrativo</p>
    </div>
  </header>

  <div class="max-w-4xl mx-auto p-4 sm:p-6">
    <div id="mensaje-error" class="hidden mb-4 rounded-lg bg-red-100 text-red-700 px-4 py-3 text-sm"></div>

    <!-- Login -->
    <section id="vista-login" class="bg-white rounded-lg shadow p-5 sm:p-8 max-w-sm mx-auto space-y-4">
      <h2 class="text-lg font-semibold">Ingreso de administrador</h2>
      <div>
        <label class="block text-sm font-medium mb-1">Email</label>
        <input id="login-email" type="email" class="w-full rounded-lg border-slate-300 border px-3 py-2" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Contraseña</label>
        <input id="login-password" type="password" class="w-full rounded-lg border-slate-300 border px-3 py-2" />
      </div>
      <button id="btn-login" type="button" class="w-full px-4 py-2 rounded-lg bg-primary hover:bg-primary-dark text-white font-semibold">Ingresar</button>
    </section>

    <!-- Panel -->
    <div id="vista-panel" class="hidden space-y-6">
      <div class="flex justify-end">
        <button id="btn-logout" type="button" class="px-4 py-2 rounded-lg bg-slate-200 hover:bg-slate-300 text-sm font-medium">Cerrar sesión</button>
      </div>

      <!-- Dashboard -->
      <section class="bg-white rounded-lg shadow p-5 sm:p-8">
        <h2 class="text-lg font-semibold mb-4">Dashboard</h2>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 text-sm">
          <div class="rounded-lg bg-primary/5 border border-primary/20 p-4">
            <p class="text-slate-500">Monto total colocado</p>
            <p id="kpi-total-colocado" class="text-xl font-bold text-primary">$0</p>
          </div>
          <div class="rounded-lg bg-amber-50 border border-amber-100 p-4">
            <p class="text-slate-500">Pendiente por cobrar</p>
            <p id="kpi-pendiente-cobrar" class="text-xl font-bold text-amber-700">$0</p>
          </div>
          <div class="rounded-lg bg-accent/10 border border-accent/30 p-4">
            <p class="text-slate-500">Intereses recaudados</p>
            <p id="kpi-intereses" class="text-xl font-bold text-accent-dark">$0</p>
          </div>
        </div>
      </section>

      <!-- Buscador -->
      <section class="bg-white rounded-lg shadow p-5 sm:p-8 space-y-4">
        <h2 class="text-lg font-semibold">Buscar créditos</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="flex gap-2">
            <input id="buscar-documento" type="text" placeholder="Documento del cliente" class="flex-1 rounded-lg border-slate-300 border px-3 py-2" />
            <button id="btn-buscar-documento" type="button" class="px-4 py-2 rounded-lg bg-slate-200 hover:bg-slate-300 text-sm font-medium">Buscar</button>
          </div>
          <div class="flex gap-2">
            <input id="buscar-imei" type="text" placeholder="IMEI del equipo" class="flex-1 rounded-lg border-slate-300 border px-3 py-2" />
            <button id="btn-buscar-imei" type="button" class="px-4 py-2 rounded-lg bg-slate-200 hover:bg-slate-300 text-sm font-medium">Buscar</button>
          </div>
        </div>
        <div id="resultados-creditos" class="space-y-4"></div>
      </section>

      <!-- Clientes recientes y celulares disponibles -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
        <section class="bg-white rounded-lg shadow p-5 sm:p-8 space-y-3">
          <h2 class="text-lg font-semibold">Clientes recientes</h2>
          <div id="lista-clientes-recientes" class="space-y-2"></div>
        </section>

        <section class="bg-white rounded-lg shadow p-5 sm:p-8 space-y-3">
          <h2 class="text-lg font-semibold">Celulares disponibles</h2>
          <div class="grid grid-cols-2 gap-2">
            <input id="celular-marca" type="text" placeholder="Marca" class="rounded-lg border-slate-300 border px-3 py-2 text-sm" />
            <input id="celular-referencia" type="text" placeholder="Referencia" class="rounded-lg border-slate-300 border px-3 py-2 text-sm" />
            <input id="celular-imei" type="text" placeholder="IMEI" class="col-span-2 rounded-lg border-slate-300 border px-3 py-2 text-sm" />
            <input id="celular-costo" type="number" min="0" step="0.01" placeholder="Valor de costo" class="rounded-lg border-slate-300 border px-3 py-2 text-sm" />
            <input id="celular-comercial" type="number" min="0" step="0.01" placeholder="Valor comercial" class="rounded-lg border-slate-300 border px-3 py-2 text-sm" />
          </div>
          <button id="btn-crear-celular" type="button" class="w-full px-4 py-2 rounded-lg bg-primary hover:bg-primary-dark text-white font-semibold text-sm">Agregar celular al inventario</button>
          <div id="lista-celulares-disponibles" class="space-y-2"></div>
        </section>
      </div>

      <!-- Vendedores -->
      <section class="bg-white rounded-lg shadow p-5 sm:p-8 space-y-4">
        <h2 class="text-lg font-semibold">Vendedores</h2>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <input id="vendedor-nombre" type="text" placeholder="Nombre" class="rounded-lg border-slate-300 border px-3 py-2" />
          <input id="vendedor-email" type="email" placeholder="Email" class="rounded-lg border-slate-300 border px-3 py-2" />
          <input id="vendedor-password" type="password" placeholder="Contraseña inicial" class="rounded-lg border-slate-300 border px-3 py-2" />
        </div>
        <button id="btn-crear-vendedor" type="button" class="px-4 py-2 rounded-lg bg-primary hover:bg-primary-dark text-white font-semibold text-sm">Crear vendedor</button>
        <div id="lista-vendedores" class="space-y-2"></div>
      </section>

      <!-- Banners -->
      <section class="bg-white rounded-lg shadow p-5 sm:p-8 space-y-4">
        <h2 class="text-lg font-semibold">Banners publicitarios</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <input id="banner-titulo" type="text" placeholder="Título de campaña" class="rounded-lg border-slate-300 border px-3 py-2" />
          <input id="banner-url" type="text" placeholder="URL de la imagen" class="rounded-lg border-slate-300 border px-3 py-2" />
          <input id="banner-inicio" type="date" class="rounded-lg border-slate-300 border px-3 py-2" />
          <input id="banner-fin" type="date" class="rounded-lg border-slate-300 border px-3 py-2" />
        </div>
        <button id="btn-crear-banner" type="button" class="px-4 py-2 rounded-lg bg-primary hover:bg-primary-dark text-white font-semibold text-sm">Crear banner</button>
        <div id="lista-banners" class="space-y-2"></div>
      </section>
    </div>
  </div>

  <!-- Botón flotante: Crear Nuevo Cliente -->
  <button id="btn-abrir-modal-cliente" type="button" class="hidden fixed bottom-6 right-6 z-40 w-14 h-14 rounded-full bg-primary hover:bg-primary-dark text-white shadow-lg text-2xl font-bold leading-none" title="Crear Nuevo Cliente">+</button>

  <!-- Modal: Crear Nuevo Cliente -->
  <div id="modal-cliente-nuevo" class="hidden fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-lg shadow p-5 sm:p-6 w-full max-w-sm space-y-4">
      <h3 class="text-lg font-semibold">Crear Nuevo Cliente</h3>
      <div id="modal-cliente-error" class="hidden rounded-lg bg-red-100 text-red-700 px-3 py-2 text-sm"></div>
      <div id="modal-cliente-exito" class="hidden rounded-lg bg-accent/10 text-accent-dark px-3 py-2 text-sm font-medium"></div>
      <div>
        <label class="block text-sm font-medium mb-1">Nombre</label>
        <input id="modal-cliente-nombre" type="text" class="w-full rounded-lg border-slate-300 border px-3 py-2" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Documento</label>
        <input id="modal-cliente-documento" type="text" class="w-full rounded-lg border-slate-300 border px-3 py-2" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Teléfono</label>
        <input id="modal-cliente-telefono" type="tel" class="w-full rounded-lg border-slate-300 border px-3 py-2" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Email</label>
        <input id="modal-cliente-email" type="email" class="w-full rounded-lg border-slate-300 border px-3 py-2" />
      </div>
      <div class="flex gap-2 pt-2">
        <button id="btn-cancelar-modal-cliente" type="button" class="flex-1 px-4 py-2 rounded-lg bg-slate-200 hover:bg-slate-300 font-medium">Cancelar</button>
        <button id="btn-guardar-modal-cliente" type="button" class="flex-1 px-4 py-2 rounded-lg bg-primary hover:bg-primary-dark text-white font-semibold">Guardar</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
