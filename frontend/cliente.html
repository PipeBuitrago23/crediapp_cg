<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CG Store - Mi Cuenta</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#0056BF",
            "primary-dark": "#00459A",
            accent: "#00C853",
            "accent-dark": "#00A344",
            background: "#F8FAFC",
            ink: "#1E293B",
          },
          fontFamily: {
            sans: ["Montserrat", "sans-serif"],
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-background min-h-screen text-ink font-sans">
  <header class="bg-white shadow-sm">
    <div class="max-w-xl mx-auto px-4 sm:px-6 py-4">
      <img src="img/logo.png" alt="CG Store" class="h-10 w-auto" />
      <p class="text-sm text-slate-500 mt-1">Mi Cuenta</p>
    </div>
  </header>

  <div class="max-w-xl mx-auto p-4 sm:p-6">
    <div id="banner-activo" class="hidden mb-4 rounded-lg overflow-hidden shadow">
      <img id="banner-activo-img" class="w-full object-cover" alt="Publicidad" />
    </div>

    <div id="mensaje-error" class="hidden mb-4 rounded-lg bg-red-100 text-red-700 px-4 py-3 text-sm"></div>

    <!-- Ingreso: solo documento, sin OTP -->
    <section id="vista-login" class="bg-white rounded-lg shadow p-5 sm:p-8 space-y-4">
      <h2 class="text-lg font-semibold">Ingresa con tu documento</h2>
      <div>
        <label class="block text-sm font-medium mb-1">Número de documento</label>
        <input id="login-documento" type="text" inputmode="numeric" autocomplete="off" class="w-full rounded-lg border-slate-300 border px-3 py-2" />
      </div>
      <button id="btn-login" type="button" class="w-full px-4 py-2 rounded-lg bg-primary hover:bg-primary-dark text-white font-semibold">Ingresar</button>
    </section>

    <!-- Panel de cuenta -->
    <div id="vista-panel" class="hidden space-y-6">
      <div class="flex justify-end">
        <button id="btn-logout" type="button" class="px-4 py-2 rounded-lg bg-slate-200 hover:bg-slate-300 text-sm font-medium">Cerrar sesión</button>
      </div>
      <div id="lista-creditos" class="space-y-4"></div>
    </div>
  </div>

  <script type="module" src="js/cliente.js"></script>
</body>
</html>
