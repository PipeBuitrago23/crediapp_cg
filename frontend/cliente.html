<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CrediApp - Mi Cuenta</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">
  <div class="max-w-xl mx-auto p-4 sm:p-6">
    <h1 class="text-2xl font-bold text-center text-indigo-700 mb-6">Mi Cuenta CrediApp</h1>

    <div id="banner-activo" class="hidden mb-4 rounded-2xl overflow-hidden shadow">
      <img id="banner-activo-img" class="w-full object-cover" alt="Publicidad" />
    </div>

    <div id="mensaje-error" class="hidden mb-4 rounded-lg bg-red-100 text-red-700 px-4 py-3 text-sm"></div>

    <!-- Solicitar OTP -->
    <section id="vista-solicitar" class="bg-white rounded-2xl shadow p-5 sm:p-8 space-y-4">
      <h2 class="text-lg font-semibold">Ingresa con tu documento</h2>
      <div>
        <label class="block text-sm font-medium mb-1">Número de documento</label>
        <input id="solicitar-documento" type="text" class="w-full rounded-lg border-slate-300 border px-3 py-2" />
      </div>
      <button id="btn-solicitar-otp" type="button" class="w-full px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-semibold">Enviar código de acceso</button>
    </section>

    <!-- Verificar OTP -->
    <section id="vista-verificar" class="hidden bg-white rounded-2xl shadow p-5 sm:p-8 space-y-4">
      <h2 class="text-lg font-semibold">Ingresa el código que enviamos a tu correo</h2>
      <div>
        <label class="block text-sm font-medium mb-1">Código de 4 dígitos</label>
        <input id="verificar-codigo" type="text" maxlength="4" class="w-full rounded-lg border-slate-300 border px-3 py-2 tracking-widest text-center text-xl" />
      </div>
      <button id="btn-verificar-otp" type="button" class="w-full px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-semibold">Verificar</button>
      <button id="btn-reenviar-otp" type="button" class="w-full px-4 py-2 rounded-lg bg-slate-200 hover:bg-slate-300 font-medium text-sm">Volver a enviar código</button>
    </section>

    <!-- Panel de cuenta -->
    <div id="vista-panel" class="hidden space-y-6">
      <div class="flex justify-end">
        <button id="btn-logout" type="button" class="px-4 py-2 rounded-lg bg-slate-200 hover:bg-slate-300 text-sm font-medium">Cerrar sesión</button>
      </div>
      <div id="lista-creditos" class="space-y-4"></div>
    </div>
  </div>

  <script type="module" src="js/cliente.js"></script>
</body>
</html>
